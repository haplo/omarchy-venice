name: checks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Validate manifest and version consistency
        run: |
          jq -e '
            .schemaVersion == 1
            and (.id | (type == "string" and length > 0))
            and (.name | (type == "string" and length > 0))
            and (.version | (type == "string" and length > 0))
            and (.kinds | (type == "array" and length > 0))
            and (.entryPoints | type == "object")
          ' manifest.json >/dev/null

          missing=$(jq -r '.entryPoints[]' manifest.json | while IFS= read -r file; do
            [ -f "$file" ] || printf '%s\n' "$file"
          done)
          if [ -n "$missing" ]; then
            printf 'Missing entry point files:\n%s\n' "$missing" >&2
            exit 1
          fi

          version=$(jq -r '.version' manifest.json)
          grep -Fq "omarchy-venice/$version" bin/venice-billing

      - name: Check tag matches manifest and changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(jq -r '.version' manifest.json)
          test "v$version" = "$GITHUB_REF_NAME"
          grep -Fq "## [$version]" CHANGELOG.md

      - name: Check shell syntax
        run: |
          for file in bin/venice-billing bin/venice-app tests/helper.test.sh tests/app.test.sh; do
            sh -n "$file"
          done

      - name: Model tests
        run: node --test tests/model.test.js

      - name: Helper tests
        run: ./tests/helper.test.sh

      - name: App tests
        run: ./tests/app.test.sh
